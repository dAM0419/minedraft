pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'minedraft'
// Minedraft Lib (공용 편집창·영역·동기화)과 그 위의 모드들
include 'lib'
include 'dab'
